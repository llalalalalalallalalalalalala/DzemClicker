<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bitcoin Donate</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 460px;
    background: #f7f7f7;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 6px;
}

p {
    color: #444;
    font-size: 14px;
}

/* LOGO (OFFICIAL FILE) */
.logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px 0 15px 0;
}

.btc-logo {
    width: 85px;
    height: 85px;
    display: block;
}

/* ADDRESS */
.address {
    background: #fff;
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    word-break: break-all;
    margin-top: 12px;
}

/* BUTTON */
button {
    margin-top: 12px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #f7931a;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff9f2a;
}

/* LANGS */
.langs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 15px;
}

.langs button {
    background: #eee;
    border: 1px solid #ddd;
    font-size: 12px;
    padding: 6px 8px;
}

.langs button.active {
    border: 2px solid #f7931a;
}

.small {
    font-size: 11px;
    color: #666;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">

    <!-- OFFICIAL BITCOIN LOGO (NO SVG ISSUES) -->
    <div class="logo-wrap">
        <img class="btc-logo"
             src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg"
             alt="Bitcoin Logo">
    </div>

    <h1 id="title">Donate in Bitcoin</h1>
    <p id="desc">Support the project if you like it ❤️</p>

    <div class="address" id="addr">
        bc1qm0x8lvhhz2920msemvpfxecwcaly8wheld49gg
    </div>

    <button onclick="copyAddr()">Copy address</button>

    <div class="langs">
        <button onclick="setLang('en')" class="active">🇬🇧 EN</button>
        <button onclick="setLang('pl')">🇵🇱 PL</button>
        <button onclick="setLang('de')">🇩🇪 DE</button>
        <button onclick="setLang('es')">🇪🇸 ES</button>
        <button onclick="setLang('it')">🇮🇹 IT</button>
        <button onclick="setLang('fr')">🇫🇷 FR</button>
        <button onclick="setLang('pt')">🇵🇹🇧🇷 PT</button>
        <button onclick="setLang('nl')">🇳🇱 NL</button>
        <button onclick="setLang('hr')">🇭🇷 HR</button>
        <button onclick="setLang('ga')">🇮🇪 GA</button>
    </div>

    <p class="small" id="footer">
        Donations help development and future updates.
    </p>

</div>

<script>

const texts = {
en:{title:"Donate in Bitcoin",desc:"Support the project if you like it ❤️",footer:"Donations help development and future updates."},
pl:{title:"Wpłać w Bitcoinie",desc:"Jeśli podoba Ci się projekt, możesz go wesprzeć ❤️",footer:"Donacje pomagają w rozwoju i aktualizacjach."},
de:{title:"Bitcoin spenden",desc:"Unterstütze das Projekt, wenn es dir gefällt ❤️",footer:"Spenden helfen bei Entwicklung und Updates."},
es:{title:"Donar en Bitcoin",desc:"Apoya el proyecto si te gusta ❤️",footer:"Las donaciones ayudan al desarrollo y actualizaciones."},
it:{title:"Dona in Bitcoin",desc:"Supporta il progetto se ti piace ❤️",footer:"Le donazioni aiutano lo sviluppo e gli aggiornamenti."},
fr:{title:"Don en Bitcoin",desc:"Soutenez le projet si vous l’aimez ❤️",footer:"Les dons aident au développement et aux mises à jour."},
pt:{title:"Doar em Bitcoin",desc:"Apoie o projeto se gostar ❤️",footer:"Doações ajudam no desenvolvimento e atualizações."},
nl:{title:"Doneer in Bitcoin",desc:"Steun het project als je het leuk vindt ❤️",footer:"Donaties helpen ontwikkeling en updates."},
hr:{title:"Doniraj u Bitcoinu",desc:"Podrži projekt ako ti se sviđa ❤️",footer:"Donacije pomažu razvoju i ažuriranjima."},
ga:{title:"Deonaigh i Bitcoin",desc:"Tacaigh leis an tionscadal más maith leat é ❤️",footer:"Cabhraíonn deonachtaí le forbairt agus nuashonruithe."}
};

function setLang(lang){
document.getElementById("title").innerText = texts[lang].title;
document.getElementById("desc").innerText = texts[lang].desc;
document.getElementById("footer").innerText = texts[lang].footer;

document.querySelectorAll(".langs button").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");
}

function copyAddr(){
navigator.clipboard.writeText(document.getElementById("addr").innerText);
alert("BTC address copied!");
}

</script>

</body>
</html>
