<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Language selector</title>

  <style>
  :root{
    --bg:#0f1724;
    --accent:#60a5fa;
    --muted:#94a3b8;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:linear-gradient(180deg,var(--bg),#071021);
    color:#e6eef8;
  }

  h1{
    font-size:2rem;
    margin-bottom:24px;
    transition:opacity 0.5s;
  }

  .selector{
    display:flex;
    gap:24px;
    align-items:flex-end;
    justify-content:center;
    padding:18px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
  }

  .lang-btn{
    width:72px;
    height:72px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.02);
    transition:0.2s;
  }

  .lang-btn:hover{
    transform:translateY(-6px) scale(1.05) rotate(-10deg);
  }

  .lang-btn.active{
    border-color:var(--accent);
    transform:translateY(-6px) scale(1.08);
  }

  .flag{
    width:56px;
    height:36px;
    margin-bottom:6px;
  }

  .label{
    font-size:13px;
    color:var(--muted);
  }

  #playButton{
    margin-top:30px;
    padding:12px 32px;
    font-size:1.1rem;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    display:none;
  }

  a, a:visited{
    color:#fff;
    text-decoration:none;
  }

  .footer-links{
    display:flex;
    gap:20px;
    margin-top:30px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .footer-links h6{
    margin:0;
    font-size:12px;
  }
  </style>
</head>

<body>

<h1 id="title">Dżem Clicker</h1>

<div class="selector">

  <!-- EN UK FLAG FIXED -->
  <button class="lang-btn" data-lang="en">
    <svg class="flag" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="36" fill="#012169"/>

      <!-- diagonals white -->
      <path d="M0 0 L60 36 M60 0 L0 36" stroke="#fff" stroke-width="6"/>

      <!-- diagonals red -->
      <path d="M0 0 L60 36 M60 0 L0 36" stroke="#C8102E" stroke-width="3"/>

      <!-- cross white -->
      <rect x="24" width="12" height="36" fill="#fff"/>
      <rect y="12" width="60" height="12" fill="#fff"/>

      <!-- cross red -->
      <rect x="27" width="6" height="36" fill="#C8102E"/>
      <rect y="15" width="60" height="6" fill="#C8102E"/>
    </svg>
    <span class="label">EN</span>
  </button>

  <button class="lang-btn" data-lang="pl">
    <svg class="flag" viewBox="0 0 60 36">
      <rect width="60" height="18" fill="#fff"/>
      <rect y="18" width="60" height="18" fill="#dc143c"/>
    </svg>
    <span class="label">PL</span>
  </button>

  <button class="lang-btn" data-lang="de">
    <svg class="flag" viewBox="0 0 60 36">
      <rect width="60" height="12" fill="#000"/>
      <rect y="12" width="60" height="12" fill="#DD0000"/>
      <rect y="24" width="60" height="12" fill="#FFCE00"/>
    </svg>
    <span class="label">DE</span>
  </button>

  <button class="lang-btn" data-lang="es">
    <img class="flag" src="https://flagcdn.com/es.svg">
    <span class="label">ES</span>
  </button>

</div>

<button id="playButton">Play</button>

<div class="footer-links">
  <h6><a href="changelog.htm">Changelog</a></h6>
  <h6><a href="ose.htm">Informacja dla OSE</a></h6>
</div>

<script>
const title=document.getElementById('title');
const titles=['Dżem Clicker','Jam Clicker','Marmeladen-Clicker','Clicker de Marmelada'];

let i=0;
setInterval(()=>{
  i=(i+1)%titles.length;
  title.style.opacity=0;
  setTimeout(()=>{
    title.textContent=titles[i];
    title.style.opacity=1;
  },400);
},2000);

const buttons=document.querySelectorAll('.lang-btn');
const playBtn=document.getElementById('playButton');

const playTexts={pl:'Graj',en:'Play',de:'Spielen',es:'Jugar'};

const langLinks={
  pl:'pl/pl.html',
  en:'en/en.html',
  de:'de/de.html',
  es:'es/es.html'
};

buttons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    const lang=btn.dataset.lang;

    playBtn.style.display='inline-block';
    playBtn.textContent=playTexts[lang]||'Play';

    playBtn.onclick=()=>{
      window.location.href=langLinks[lang];
    };
  });
});
</script>

</body>
</html>
